<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073a69">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" href="/assets/cubis-shop-icon.png?v=20261012" type="image/png">
  <link rel="apple-touch-icon" href="/assets/cubis-shop-icon.png?v=20261012">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <title>Pagina nu este disponibilă — Cubis Shop</title>
  <style>
    :root { color-scheme: light; font-family: Manrope, Arial, sans-serif; color: #06245a; background: #f5faff; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; grid-template-rows: auto 1fr auto; background: radial-gradient(circle at 75% 15%, #dff4ff 0, transparent 30%), #f7fbff; }
    header, footer { background: #fff; border-bottom: 1px solid #dce9f6; }
    header > div, footer > div, main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }
    header > div { min-height: 92px; display: flex; align-items: center; }
    header img { width: 220px; max-width: 58vw; height: auto; display: block; }
    main { display: grid; place-items: center; padding: 64px 0; }
    section { width: min(760px, 100%); padding: clamp(38px, 7vw, 74px); text-align: center; background: #fff; border: 1px solid #d8e7f5; border-radius: 24px; box-shadow: 0 26px 70px rgba(5, 50, 103, .10); }
    .code { margin: 0; color: #0788f7; font-size: clamp(52px, 12vw, 112px); font-weight: 800; line-height: .9; }
    h1 { margin: 22px 0 12px; font-size: clamp(28px, 5vw, 48px); line-height: 1.08; }
    p { margin: 0 auto; max-width: 560px; color: #60738f; font-size: 16px; line-height: 1.65; }
    nav { margin-top: 30px; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    a { min-height: 50px; padding: 0 24px; display: inline-flex; align-items: center; justify-content: center; border: 1px solid #0788f7; border-radius: 10px; color: #0675d8; font-weight: 800; text-decoration: none; }
    a:first-child { color: #fff; background: linear-gradient(135deg, #0788f7, #006de3); }
    footer { border-top: 1px solid #dce9f6; border-bottom: 0; background: #052e57; color: #d8e9f8; }
    footer > div { min-height: 64px; display: flex; align-items: center; justify-content: space-between; gap: 20px; font-size: 13px; }
    @media (max-width: 560px) { header > div { min-height: 72px; } header img { width: 170px; } main { padding: 28px 0; } section { padding: 38px 20px; border-radius: 18px; } nav { flex-direction: column; } footer > div { padding: 16px 0; align-items: flex-start; flex-direction: column; justify-content: center; } }
  </style>
</head>
<body>
  <header><div><a href="/" aria-label="Cubis Shop — Acasă" style="min-height:0;padding:0;border:0;background:none"><img src="/assets/cubis-shop-logo.png" alt="Cubis Shop" width="440" height="104"></a></div></header>
  <main id="main">
    <section aria-labelledby="not-found-title">
      <p class="code" aria-hidden="true">404</p>
      <h1 id="not-found-title">Pagina nu este disponibilă</h1>
      <p>Această secțiune nu face parte încă din noul website Cubis Shop. Poți reveni la homepage sau poți explora catalogul disponibil.</p>
      <nav aria-label="Navigare din pagina 404"><a href="/">Înapoi la homepage</a><a href="/magazin">Vezi magazinul</a></nav>
    </section>
  </main>
  <footer><div><span>© 2026 Cubis Shop</span><span>Piese mici. Posibilități mari.</span></div></footer>
</body>
</html>
